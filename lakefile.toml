name = "Erdos188"
defaultTargets = ["OAI", "Erdos188", "Challenge", "Solution"]

# No silently-introduced implicit binders anywhere in the corpus.
[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc4"

# Modules from openai/math used by the lower bound, with narrowed imports.
[[lean_lib]]
name = "OAI"
globs = ["OAI.+"]

[[lean_lib]]
name = "Erdos188"
globs = ["Erdos188.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
